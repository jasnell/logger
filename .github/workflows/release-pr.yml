name: Create release pull request

# Opens a pull request that bumps the package version. Merging it triggers
# the release workflow, which publishes the package.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The new version: a semver increment (patch, minor, major,
          prerelease, ...) or an explicit version (e.g. 1.2.3).
        required: true
        default: patch

permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Bump version
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: release/v${{ steps.bump.outputs.version }}
          commit-message: 'meta: release v${{ steps.bump.outputs.version }}'
          title: 'meta: release v${{ steps.bump.outputs.version }}'
          body: >-
            Bumps the package version to
            v${{ steps.bump.outputs.version }}. Merging this pull request
            publishes the release to npm.
          labels: release
